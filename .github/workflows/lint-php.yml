# A syntax check on every PHP version the plugin claims to support. Cheap, and
# it catches what a coding-standards run does not.
name: PHP lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin header says PHP 7.4 or newer.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # php -l itself, rather than a linting tool, so there is nothing to
      # install and nothing whose name can change under us.
      - name: Lint
        run: |
          find . -type d \( -name vendor -o -name node_modules -o -name .git \) -prune -o \
            -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
